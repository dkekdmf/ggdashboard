<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 시작 · QR 코드</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body class="bg-slate-900 min-h-screen p-6 md:p-10 font-sans text-white">

<div class="max-w-6xl mx-auto space-y-8">

    <header class="text-center space-y-2">
        <h1 class="text-3xl md:text-4xl font-black">📱 휴대폰으로 찍어 주세요</h1>
        <p class="text-sm text-slate-400">
            카메라 앱으로 QR 코드를 비추면 바로 열립니다. 주소를 직접 입력하지 않아도 돼요.
        </p>
    </header>

    <!-- 주소를 못 찾았을 때 -->
    <div id="no-network" class="hidden bg-rose-900/40 border border-rose-700 rounded-2xl p-6 text-center space-y-2">
        <p class="text-lg font-black text-rose-200">교실 와이파이 주소를 찾지 못했어요</p>
        <p class="text-sm text-rose-300">
            노트북이 와이파이에 연결되어 있는지 확인해 주세요.
        </p>
    </div>

    <div id="cards" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

    <!-- 안내 -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-2">
        <p class="text-sm font-black text-slate-200">⚠️ 이것만 확인해 주세요</p>
        <ul class="text-xs text-slate-400 space-y-1 leading-relaxed">
            <li>· 휴대폰이 <b class="text-slate-200">교실 와이파이</b>에 연결되어 있어야 열립니다</li>
            <li>· 선생님 노트북의 <b class="text-slate-200">앱이 켜져 있어야</b> 합니다</li>
            <li>· 주소가 바뀌면 이 화면을 <b class="text-slate-200">새로고침</b>하면 QR도 새로 그려집니다</li>
        </ul>
    </div>

    <p class="text-center text-xs text-slate-500">
        지금 주소 <span id="ip-text" class="font-mono text-slate-300">확인 중...</span>
        · <button onclick="loadAndDraw()" class="underline hover:text-slate-300">새로고침</button>
    </p>
</div>

<script>
/* 수업에서 쓰는 화면 세 가지. 서버가 알려 준 주소로 QR 을 그린다. */
const CARDS = [
  {
    key: 'lesson1',
    emoji: '🔌',
    title: '1교시',
    subtitle: '아두이노와 AI',
    detail: '무드등 · 온습도 · 반응속도 · AI 카메라 · 조건문',
    accent: 'border-indigo-500',
    badge: 'bg-indigo-500'
  },
  {
    key: 'lesson2',
    emoji: '🧠',
    title: '2교시',
    subtitle: '컴퓨터의 생각법',
    detail: '나만의 프로그램 · 스도쿠 · 미로 · 가위바위보 · 모스 부호',
    accent: 'border-violet-500',
    badge: 'bg-violet-500'
  },
  {
    key: 'nodered',
    emoji: '💡',
    title: '무드등',
    subtitle: 'Node-RED 화면',
    detail: '휴대폰으로 교실 무드등 색 바꾸기',
    accent: 'border-rose-500',
    badge: 'bg-rose-500'
  }
];

/**
 * QR 코드를 그린다.
 *
 * typeNumber 를 0 으로 두면 글자 길이에 맞는 크기를 알아서 고른다.
 * 'M' 은 오류 복원 수준으로, 조금 가려져도 읽히는 정도다.
 */
function makeQrHtml(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();

  // 셀 크기를 크게 잡아야 프로젝터로 띄웠을 때 뒷자리 아이도 찍을 수 있다
  return qr.createImgTag(6, 8);
}

function drawCards(urls) {
  const box = document.getElementById('cards');
  box.innerHTML = '';

  CARDS.forEach(card => {
    const url = urls[card.key];
    if (!url) return;

    const el = document.createElement('div');
    el.className = `bg-white rounded-3xl border-4 ${card.accent} p-5 space-y-3 text-center`;

    el.innerHTML = `
      <div class="flex items-center justify-center gap-2">
        <span class="text-2xl">${card.emoji}</span>
        <span class="${card.badge} text-white text-xs font-black px-3 py-1 rounded-full">${card.title}</span>
      </div>

      <h2 class="text-lg font-black text-slate-800">${card.subtitle}</h2>

      <div class="flex justify-center bg-white p-2 rounded-xl">${makeQrHtml(url)}</div>

      <p class="text-[11px] text-slate-400 leading-relaxed">${card.detail}</p>
      <p class="font-mono text-[10px] text-slate-500 break-all bg-slate-100 rounded-lg px-2 py-1">${url}</p>
    `;

    box.appendChild(el);
  });
}

async function loadAndDraw() {
  const ipText = document.getElementById('ip-text');

  try {
    const res = await fetch('/api/network/info');
    const data = await res.json();

    if (!data.found) {
      document.getElementById('no-network').classList.remove('hidden');
      document.getElementById('cards').innerHTML = '';
      ipText.innerText = '찾지 못함';
      return;
    }

    document.getElementById('no-network').classList.add('hidden');
    ipText.innerText = data.ip;
    drawCards(data.urls);

  } catch (e) {
    console.error('주소를 가져오지 못했습니다:', e);
    ipText.innerText = '서버 응답 없음';
    document.getElementById('no-network').classList.remove('hidden');
  }
}

loadAndDraw();
</script>
</body>
</html>
